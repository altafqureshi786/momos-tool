<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>17-Digit Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #EFEBE2;
    color: #1E2420;
    display: flex;
    justify-content: center;
    padding: 32px 20px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #4A7C6B;
    font-weight: 600;
    margin: 0 0 8px;
  }
  h1 {
    font-size: 2rem;
    line-height: 1.15;
    font-weight: 700;
    color: #161B18;
    margin: 0 0 16px;
  }
  .lead {
    color: #5C6660;
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  .card {
    background: #fff;
    border: 1px solid #DCD5C6;
    border-radius: 16px;
    padding: 20px;
  }
  label.field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #7A7267;
    margin-bottom: 8px;
  }
  select, .date-display {
    width: 100%;
    border-radius: 12px;
    padding: 14px 40px 14px 16px;
    font-size: 15px;
    color: #161B18;
    background: #fff;
    appearance: none;
    -webkit-appearance: none;
  }
  select {
    border: 2px solid #2E5945;
  }
  .select-wrap, .date-wrap { position: relative; margin-bottom: 12px; }
  .select-wrap::after, .date-wrap::after {
    content: "";
    position: absolute;
    right: 16px;
    top: 50%;
    width: 8px;
    height: 8px;
    border-right: 2px solid #7A7267;
    border-bottom: 2px solid #7A7267;
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  .date-manual {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .date-manual input {
    border: 1px solid #DCD5C6;
    border-radius: 12px;
    padding: 14px 12px;
    font-size: 15px;
    color: #161B18;
    text-align: center;
    min-width: 0;
  }
  #ddInput, #mmInput { flex: 1; }
  #yyyyInput { flex: 1.4; }
  .date-manual input:focus {
    outline: none;
    border-color: #2E5945;
    border-width: 2px;
  }
  .date-sep { color: #7A7267; font-size: 15px; }
  .tags { display: flex; gap: 8px; margin-bottom: 24px; }
  .tag {
    font-size: 12px;
    background: #F1EDE3;
    color: #5C6660;
    padding: 6px 12px;
    border-radius: 999px;
  }
  .code-box {
    background: #161B18;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .code-text {
    font-family: "SF Mono", "Roboto Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.02em;
    word-break: break-all;
    margin: 0 0 12px;
  }
  .code-text .plu { color: #7FD1AE; }
  .code-text .wt { color: #F0C889; }
  .code-text .dt { color: #F0A0A8; }
  .copy-btn {
    width: 100%;
    background: #2E5945;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .copy-btn:hover { background: #254A39; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 12px;
    color: #7A7267;
    margin-bottom: 24px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .qr-frame {
    display: flex;
    justify-content: center;
    background: #F8F6F0;
    border: 1px solid #DCD5C6;
    border-radius: 12px;
    padding: 20px;
  }
  #qrcode { line-height: 0; }
  #qrcode img, #qrcode canvas, #qrcode table { border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">HUB OPS · LABEL CODES</p>
  <h1>17-Digit Code Generator</h1>
  <p class="lead">Select the product and the use-by date shown on the packet. The code is built automatically — copy it straight onto the label, or scan the QR code.</p>

  <div class="card">
    <label class="field-label">PRODUCT</label>
    <div class="select-wrap">
      <select id="product"></select>
    </div>
    <div class="tags">
      <span class="tag" id="pluTag"></span>
      <span class="tag" id="weightTag"></span>
    </div>

    <label class="field-label">USE-BY DATE</label>
    <div class="date-manual">
      <input type="text" id="ddInput" maxlength="2" placeholder="DD" inputmode="numeric" />
      <span class="date-sep">/</span>
      <input type="text" id="mmInput" maxlength="2" placeholder="MM" inputmode="numeric" />
      <span class="date-sep">/</span>
      <input type="text" id="yyyyInput" maxlength="4" placeholder="YYYY" inputmode="numeric" />
    </div>

    <label class="field-label">GENERATED CODE</label>
    <div class="code-box">
      <p class="code-text" id="codeText"></p>
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>
    <div class="legend">
      <span><span class="swatch" style="background:#7FD1AE"></span>PLU (6)</span>
      <span><span class="swatch" style="background:#F0C889"></span>Weight (5)</span>
      <span><span class="swatch" style="background:#F0A0A8"></span>Use-by date (6, DDMMYY)</span>
    </div>

    <label class="field-label">QR CODE</label>
    <div class="qr-frame">
      <div id="qrcode"></div>
    </div>
  </div>
</div>

<script>
  const PRODUCTS = [
    { name: "Chicken & Cheese Momos (8pc)", plu: "291009", weight: 200 },
    { name: "Classic Prawn Momos (8pc)", plu: "794367", weight: 200 },
    { name: "Korean Chicken Momos (6pc)", plu: "208233", weight: 150 },
    { name: "Korean Chicken Momos (8pc)", plu: "333796", weight: 200 },
    { name: "Loaded Chicken Momos (20pcs)", plu: "374124", weight: 500 },
    { name: "Loaded Chicken Momos (16pc)", plu: "754637", weight: 400 },
    { name: "Loaded Chicken Momos (6pc)", plu: "182499", weight: 150 },
    { name: "Loaded Chicken Momos (8pcs)", plu: "510624", weight: 200 },
  ];

  const productSelect = document.getElementById("product");
  const pluTag = document.getElementById("pluTag");
  const weightTag = document.getElementById("weightTag");
  const ddInput = document.getElementById("ddInput");
  const mmInput = document.getElementById("mmInput");
  const yyyyInput = document.getElementById("yyyyInput");
  const codeText = document.getElementById("codeText");
  const copyBtn = document.getElementById("copyBtn");
  const qrDiv = document.getElementById("qrcode");

  PRODUCTS.forEach((p, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = `${p.name} — PLU ${p.plu}`;
    productSelect.appendChild(opt);
  });

  function pad(n, len) { return String(n).padStart(len, "0"); }

  const today = new Date();
  ddInput.value = pad(today.getDate(), 2);
  mmInput.value = pad(today.getMonth() + 1, 2);
  yyyyInput.value = today.getFullYear();

  function sanitizeDigits(input, maxLen) {
    input.value = input.value.replace(/\D/g, "").slice(0, maxLen);
  }

  function render() {
    const product = PRODUCTS[productSelect.value];
    pluTag.textContent = `PLU ${product.plu}`;
    weightTag.textContent = `${product.weight}g`;

    let d = ddInput.value.padStart(2, "0") || "00";
    let m = mmInput.value.padStart(2, "0") || "00";
    let y = yyyyInput.value.padStart(4, "0") || "0000";

    const pluPart = pad(product.plu, 6);
    const weightPart = pad(product.weight, 5);
    const datePart = `${d}${m}${y.slice(-2)}`;
    const full = pluPart + weightPart + datePart;

    codeText.innerHTML =
      `<span class="plu">${pluPart}</span>` +
      `<span class="wt">${weightPart}</span>` +
      `<span class="dt">${datePart}</span>`;

    qrDiv.innerHTML = "";
    const qr = qrcode(0, "M");
    qr.addData(full);
    qr.make();
    qrDiv.innerHTML = qr.createImgTag(5, 8);

    copyBtn.onclick = () => {
      navigator.clipboard.writeText(full).then(() => {
        copyBtn.textContent = "Copied";
        setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
      });
    };
  }

  productSelect.addEventListener("change", render);
  [ddInput, mmInput].forEach((el) => {
    el.addEventListener("input", () => {
      sanitizeDigits(el, 2);
      render();
    });
  });
  yyyyInput.addEventListener("input", () => {
    sanitizeDigits(yyyyInput, 4);
    render();
  });
  render();
</script>
</body>
</html>
